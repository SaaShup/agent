services:
  agent:
    build: .
    image: saashup/agent:2
    restart: unless-stopped
    init: true
    ports:
      - "1880:1880"
    environment:
      PORT: "1880"
      HTTP_SECURE: ${HTTP_SECURE:-false}
      HTTP_SECURE_IP: ${HTTP_SECURE_IP:-}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      IP_FILTERING: ${IP_FILTERING:-}
      DATAPATH: /data
      API_USERNAME: ${API_USERNAME:-admin}
      API_PASSWORD: ${API_PASSWORD:-}
      HEALTHCHECK_PASSWORD: ${HEALTHCHECK_PASSWORD:-saashup}
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - agent:/data
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  agent:
